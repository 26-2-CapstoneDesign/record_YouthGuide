name: Test analysis automation

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/analysis-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
